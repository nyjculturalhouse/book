<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소소책방 | 내정보</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="./js/tailwind-config.js"></script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <link rel="stylesheet" href="./css/style.css">



  <script src="./js/api.js" defer></script>
  <script src="./js/ui.js" defer></script>
  <script src="./js/utils.js" defer></script>
  <script src="./js/app.js" defer></script>
  <script src="./js/profile.js" defer></script>
<link rel="stylesheet" href="./css/culture-theme.css">
</head>

<body class="culture-page bg-surface text-onSurface font-suit text-[15px] font-normal tracking-[-0.015em]">

  <!-- Header -->
  <a class="skip-link" href="#main-content">본문 바로가기</a>
  <header class="bg-container shadow-soft sticky top-0 z-50">
    <div class="max-w-[1400px] mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex flex-col leading-none">
        <span class="text-[8px] font-suit font-medium tracking-[-0.04em] text-gray-400 mb-0.5">남양주시 문화의집</span>
        <span class="font-haeong text-[26px] font-normal tracking-[-0.04em] text-accent-bg">소소책방</span>
      </a>

      <nav class="hidden md:flex items-center gap-1 font-suit text-[16px] font-medium tracking-[-0.02em]">
        <a href="index.html" class="px-4 py-2 rounded-full hover:bg-gray-100 hover:text-gray-900 transition-all duration-200">홈</a>
        <a href="books.html" class="px-4 py-2 rounded-full hover:bg-gray-100 hover:text-gray-900 transition-all duration-200">도서대여</a>
        <a href="location.html" class="px-4 py-2 rounded-full hover:bg-gray-100 hover:text-gray-900 transition-all duration-200">도서위치</a>
        <a href="rentals.html" class="px-4 py-2 rounded-full hover:bg-gray-100 hover:text-gray-900 transition-all duration-200">대여현황</a>

        <!-- 📌 활성화 메뉴 테마 컬러: 시맨틱 브랜드 컬러 클래스로 통일 -->
        <a aria-current="page" href="profile.html" class="px-4 py-2 rounded-full bg-accent-bg text-white font-medium shadow-sm">내정보</a>

        <button id="logoutBtn" class="px-4 py-2 rounded-full text-gray-500 hover:bg-red-50 hover:text-red-500 transition-all duration-200">로그아웃</button>
      </nav>
    </div>
  </header>

  <!-- 메인 본문 -->
  <main id="main-content" class="max-w-[1400px] mx-auto px-4 py-8">

    <h2 class="font-suit text-[24px] font-medium tracking-[-0.025em] mb-6">내 정보</h2><p class="culture-page-description">소소책방에 등록된 회원 정보를 확인하세요.</p>

    <div id="profileContainer" class="bg-container rounded-xl shadow-soft p-6 mb-8">
      <div class="flex justify-center py-8">
        <span class="material-symbols-outlined animate-spin text-gray-400">
          progress_activity
        </span>
      </div>
    </div>

    <!-- 회원탈퇴 영역 -->
    <div class="flex justify-end">
      <!-- 📌 탈퇴 버튼 색상을 서비스 무드에 어울리는 소프트 레드 톤(bg-[#C94A4A] / hover:bg-[#B23B3B])으로 재정비 -->
      <button
        id="withdrawBtn"
        class="inline-flex items-center gap-2 px-6 py-3 rounded-xl font-suit text-[15px] font-semibold tracking-[-0.015em] text-white bg-[#C94A4A] hover:bg-[#B23B3B] transition-all duration-200 shadow-md hover:shadow-lg hover:scale-[1.02] active:scale-95"
      >
        <span
          class="material-symbols-outlined"
          style="font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;"
        >
          delete
        </span>
        회원탈퇴
      </button>
    </div>

  </main>

  <div id="toastContainer" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2"></div>

  <!-- 📌 전역 카피라이트 라이선스 푸터 추가 -->
  <footer id="soso-license-footer" class="mt-16 mb-24 w-full text-center text-[12px] sm:text-[14px] font-light tracking-[-0.01em] text-gray-400/90 leading-relaxed">
    <p>
      남양주시 문화의집 · 소소책방<br>일상에 책 한 권, 소소책방과 함께하세요.
    </p>
  </footer>

</body>
</html>
